# 날짜별 할 일 9종과 추가 할 일 (명세서 부속표 A, FR-015, FR-017~FR-021)
# 기한은 규칙으로만 계산한다 (LLM 사용 안 함). 잔금일·만기일이 바뀌면 연결된 기한을 모두 다시 계산한다.
version: "1.4"   # 1.1: 기한 정답표 PO 결정 반영 (2026-10-12), 1.2: 잔금일이 미뤄지면 끝낸 T3·T4를 다시 할 일로 (2026-10-15), 1.3: 알림 시점 (2026-10-22), 1.4: 나중에 올리기 증빙 재알림 (2026-10-26)
as_of: "2026-10-26"
basis: "서비스 기획안 v4.35 '날짜별 할 일 9종', 요구사항 명세서 v0.5 부속표 A"

# 임대차 신고 대상 기준 (FR-015)
# 보증금 6천만 원 이하이면서 월세 30만 원 이하면 신고 비대상 → 신고 알림 대신 확정일자 알림
report_rule:
  exempt_when:
    all:
      - {field: deposit, op: "<=", value: 60000000}
      - {field: monthly_rent, op: "<=", value: 300000}
  basis: 부동산 거래신고 등에 관한 법률 (주택 임대차 계약 신고), 신고 대상 지역 기준은 출시 전 재확인
  hypothesis: true

# 화면 맨 위에 고정하는 할 일 (FR-019): 반환보증 가입, 만기 통보, 반환 확인
# 시작일이 아직 안 온 것도 이 자리에 두고, 화면에서 흐리게 표시한다 (정답표 Q6)
pinned: [T5, T6, T7, T8, T9]

# 목록 순서 (정답표 Q4, 2026-10-12 PO 결정)
# 1) 맨 위로 올리는 규칙(move_to_top, move_to_top_when)에 걸린 할 일 → 2) pinned → 3) 나머지는 기한 빠른 순
# 같은 단계 안에서는 할 일 번호 순
order: [move_to_top, pinned, due_date]

# 알림 시점과 경로 (FR-040, FR-041, FR-044). 알림 실행(POST /api/admin/notifications/run)이 이 기준으로 그날 보낼 알림을 만든다.
# 앱 안 기한표에는 모든 알림을 남기고, 이메일은 MVP 1종(반환보증 가입 마감)만 보낸다 (기획안 MVP 범위)
notifications:
  on_start: true            # 할 일 시작일 (재알림 T6·T8은 시작일 대신 remind_date)
  due_before_days: [7, 1]   # 기한 7일 전·1일 전
  catch_up_days: 7          # 알림 실행을 건너뛴 날의 알림은 7일 안의 것만 보낸다 (가상 날짜로 몇 달을 건너뛰어도 지난 알림이 쏟아지지 않게)
  email_todos: [T5, T6]     # 이메일로도 보내는 할 일: 반환보증 가입(기한 7·1일 전)과 마감 30일 전 재알림
  evidence_after_days: 7    # 나중에 올리기(FR-030) 한 할 일은 나중에 올리기로 바꾼 날(증빙을 지운 날) 7일 뒤 증빙을 올리라고 다시 알림 (앱 안 알림만)
  hypothesis: true          # 기한 7·1일 전, 7일, 증빙 재알림 7일은 팀 제안 (PO 확인 필요)

# 계약 당일 첫 계약 서류 (FR-051, UC-003 5단계, UI-03). 기록함의 첫 서류로 저장한다 (POST /api/contracts/{id}/documents).
# 할 일이 아니라 완료·알림·기한은 없다. 특약 반영 분기의 "특약이 보이는 계약서 사진"(special_terms.yaml require_document)도 이 계약서로 남긴다
first_documents:
  - id: contract
    label: 계약서
    detail: 특약이 보이게 모든 쪽을 찍어 올려요
  - id: down_payment
    label: 계약금 이체 내역
    detail: 임대인 명의 계좌로 보낸 이체 화면을 올려요

todos:
  - id: T1
    title: 임대차 신고 (계약 후 30일 이내)
    when_applies: {field: report_required, op: "==", value: true}
    start: {anchor: contract_date}
    due: {anchor: contract_date, offset_days: 30}
    complete_with: 중개사가 대신 신고했으면 그 확인서로 완료
    evidence: 임대차 신고필증

  - id: T2
    title: 보증 가입 여부 확정
    detail_by_guarantor:
      HUG: 전세보증 사전심사 신청
      HF: 취급 은행 사전 상담
      SGI: 취급 기관 사전 상담
      none: 반환보증 가입 여부 결정
    prerequisites: [T1]           # 신고 비대상이면 T1이 없으므로 계약 직후 바로 시작
    prerequisites_skip_when:      # 기한이 계약일로 당겨지면(set_due) T1을 기다리지 않음 (정답표 Q3)
      - {linkage: L-RATIO90}
      - {linkage: L-VIOLATION}
    start: {anchor: contract_date}
    due: {anchor: balance_date, offset_days: -1}
    variants:
      - when: {field: brokered, op: "==", value: false}
        detail: 직거래는 사전심사 대상이 아니므로 잔금 전 보증기관 상담으로 대체
    move_to_top_when:
      - {special_term: S-GUARANTEE-CANCEL, result: rejected}
    evidence: 사전심사 결과 또는 상담 기록

  - id: T3
    title: 잔금일 아침 등기부 재비교
    detail: 등기부 요약을 다시 올리면 계약 전과 자동 비교. 변동이 있으면 "잔금 보류 후 상담" 안내
    start: {anchor: balance_date}
    due: {anchor: balance_date}
    required_checks_from: linkage   # 근저당이 있었으면 근저당 금액 비교가 필수 (L-MORTGAGE)
    reopen_if_done_before_start: true   # 잔금일이 미뤄져 완료일이 새 시작일보다 앞서면 다시 할 일로 (PO 2026-10-15)
    evidence: 잔금일 등기부 열람본

  - id: T4
    title: 전입신고
    detail: 임대차 신고를 했으면 확정일자는 이미 부여됨. 신고하지 않은 계약이면 확정일자도 함께
    start: {anchor: balance_date}
    due: {anchor: balance_date}
    move_to_top_when:
      - {special_term: S-NO-MORTGAGE, result: rejected}
    reopen_if_done_before_start: true   # T3과 같음. 다시 할 일이 되면 T5 시작일도 다시 계산
    evidence: 확정일자 받은 계약서

  - id: T5
    title: 반환보증 가입
    detail: 입력한 보증기관 기준 (guarantors.yaml)
    start:
      anchor: loan_execution_date
      if_later: {anchor: T4.done_date, offset_days: 1}   # 전입신고 완료일이 대출 실행일보다 늦으면 전입신고 다음 날 (정답표 Q9). 대출은 있는데 실행일을 모를 때도 이 기준 (Q10)
      if_no_loan: {anchor: T4.done_date, offset_days: 1}   # 대출이 없으면 실제 전입신고 완료일 다음 날 (정답표 Q8)
    due: {from: guarantors.yaml, key: return_guarantee_deadline}
    move_to_top_when:
      - {alert_level_gte: caution}
    evidence: 보증서

  - id: T6
    title: 반환보증 가입 마감 전 재알림
    when_applies: {todo_not_done: T5}
    remind: {from: guarantors.yaml, key: return_guarantee_deadline, offset_days: -30}
    hypothesis: false  # 마감 30일 전 재알림 (PO 확정 2026-10-07)
    evidence: null

  - id: T7
    title: 갱신 또는 이사 의사 통보 안내
    detail: 갱신하면 대출·보증 연장 준비, 이사하면 갈아타기 시작
    start: {anchor: end_date, offset_months: -6}
    due: {anchor: end_date, offset_months: -2}   # 갱신요구·갱신거절 통지 기간: 만기 6개월 전 ~ 2개월 전
    variants:
      - when: {field: renewal_right_used, op: "==", value: true}
        detail: 이미 계약갱신요구권을 쓴 계약이므로 다시 쓸 수 없음을 안내
    choices:
      renew: [대출 연장 준비, 보증 연장 준비]
      move: [갈아타기 시작]
    basis: 주택임대차보호법 제6조, 제6조의3
    evidence: 통보 기록 (문자 화면)

  - id: T8
    title: 통보 마감 재알림
    when_applies: {todo_not_done: T7}
    remind: {anchor: end_date, offset_months: -2, offset_days: -14}
    hypothesis: false  # 통보 마감(만기 2개월 전) 2주 전에 알림 (PO 확정 2026-10-07, 기획안 v4.34)
    evidence: 통보 기록

  - id: T9
    title: 보증금 반환 확인
    detail: '"보증금을 돌려받았나요?" 확인. 못 받았으면 반환 대응으로 전환 (FR-024, FR-034)'
    start: {anchor: end_date}
    due: {anchor: end_date}
    on_answer:
      not_returned: switch_to_return_response
    evidence: 반환 이체 내역

# 규칙이 추가하는 할 일 (9종 외)
extra_todos:
  - id: X-FIXED-DATE-STATUS
    title: 확정일자 부여현황 열람 (임대인 동의)
    added_by: [L-MULTI]
    start: {anchor: contract_date, offset_days: -1}
  - id: X-LANDLORD-PLAN
    title: 임대인 반환 계획 서면 확인
    added_by: [alert.warning]
    start: {anchor: end_date, offset_months: -6}
  - id: X-HUG-LANDLORD-RISK
    title: HUG 안심전세앱 임대인 위험도 조회
    added_by: [S-TAX-CERT.rejected]
    start: {anchor: contract_date}
