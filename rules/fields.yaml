# 규칙에서 쓰는 입력 값 이름
# 다른 규칙 파일의 조건(field)은 여기 있는 이름만 쓴다.
version: "0.1"
as_of: "2026-10-07"
basis: "요구사항 명세서 v0.3 FR-001, FR-005, FR-014"

fields:
  # 계약 전 확인 입력 (FR-001)
  housing_type:
    type: enum
    values: [apartment, row_house, officetel, multi_household, detached]
    label: 주택 유형 (아파트 / 연립다세대 / 오피스텔 / 다가구 / 단독)
  deposit:
    type: integer
    unit: 원
    label: 보증금
  exclusive_area:
    type: number
    unit: ㎡
    label: 전용면적
  official_price:
    type: integer
    unit: 원
    label: 공동주택 공시가격

  # 계약 조건 입력 (FR-014, 계약 당일 체크에서 입력)
  monthly_rent:
    type: integer
    unit: 원
    label: 월세 (전세면 0)
  contract_date:
    type: date
    label: 계약일
  balance_date:
    type: date
    label: 잔금일
  end_date:
    type: date
    label: 만기일
  loan:
    type: boolean
    label: 전세대출 유무
  loan_execution_date:
    type: date
    label: 대출 실행일
  guarantor:
    type: enum
    values: [HUG, HF, SGI, none]
    label: 보증기관 (미가입은 none)
  brokered:
    type: boolean
    label: 중개 거래 여부 (직거래면 false)
  renewal_right_used:
    type: boolean
    label: 계약갱신요구권을 써서 갱신한 계약인지
  co_tenant:
    type: boolean
    label: 공동 계약자(부부) 여부

  # 등기부 "주요 등기사항 요약" 추출 결과 (FR-005, 사용자 확인값)
  registry.seizure:
    type: boolean
    label: 압류·가압류·가처분·경매개시결정 등기
  registry.mortgage:
    type: boolean
    label: 근저당 있음
  registry.mortgage_amount:
    type: integer
    unit: 원
    label: 근저당 채권최고액 합계 (선순위 채권)
  registry.trust:
    type: boolean
    label: 신탁등기 있음

  # 확인 결과 (사용자 입력)
  trust_consent:
    type: enum
    values: [unknown, obtained, unavailable]
    label: 신탁사 동의서 (확인 전 / 받음 / 받을 수 없음)
  building.violation:
    type: boolean
    label: 위반건축물 (건축물대장)
  guarantor_consult:
    type: enum
    values: [not_yet, possible, impossible]
    label: 보증기관 상담 결과 (상담 전 / 가능 / 보증 불가)
  landlord_tax_checked:
    type: boolean
    label: 임대인 체납 여부를 확인했는지 (앱은 확인할 수 없어 기본 false)

  # 계산 값 (alert.yaml)
  estimated_price:
    type: integer
    unit: 원
    label: 추정 주택가격
  deposit_ratio:
    type: number
    label: 내 보증금 비율 = (보증금 + 선순위 채권) ÷ 추정 주택가격
  nearby_jeonse_median:
    type: integer
    unit: 원
    label: 같은 단지·비슷한 면적의 최근 전세 거래 중앙값
  nearby_sample_count:
    type: integer
    label: 주변 전세 거래 건수
  report_required:
    type: boolean
    label: 임대차 신고 대상인지 (todos.yaml의 report_rule로 계산)

  # 계약 당일 기록
  special_term_result:
    type: map
    values: [inserted, rejected]
    label: 특약별 넣음 / 거절당함 (special_terms.yaml의 id가 키)
