# 판정 기준 (명세서 부속표 B, FR-009)
# 위에서부터 차례로 보고, 처음 해당하는 단계로 판정한다.
# 한 집에 여러 항목이 걸리면 가장 높은 단계를 쓰고, 걸린 항목은 모두 화면에 보여 준다.
# explanation: 걸린 항목을 화면에 보여 줄 때 붙이는 쉬운 말 설명 (출시 전 법률 표현 검토 필요)
version: "1.1"   # 1.1: 걸린 항목 설명(explanation)·확인 못 한 항목 안내(guide) 추가 (2026-10-12)
as_of: "2026-10-12"
basis: "서비스 기획안 v4.34 '① 맞춤 할 일' 판정표, 요구사항 명세서 v0.4 부속표 B"
hypothesis: true   # 판정 기준은 팀 가설

levels:
  - id: not_applicable
    label: 대상 아님
    next_step: 점검·경보 대상이 아님을 안내하고 할 일 관리만 이용 (패키지 4,900원)
    rules:
      - id: NA-1
        label: 다가구·단독주택
        explanation: 다가구·단독주택은 다른 세대의 보증금을 등기부로 알 수 없어 점검·경보 대상이 아니에요. 날짜별 할 일은 챙겨 드려요.
        when: {field: housing_type, op: in, value: [multi_household, detached]}

  - id: problem
    label: 문제 항목
    next_step: 결제 전 멈춤. 계약 재검토와 공공 상담 창구 안내 (FR-011)
    block_payment: true
    rules:
      - id: P-1
        label: 압류·가압류·가처분·경매개시결정 등기
        explanation: 집에 압류나 경매 절차가 걸려 있어요. 이 상태로 계약하면 보증금을 돌려받지 못할 수 있어요.
        when: {field: registry.seizure, op: "==", value: true}
      - id: P-2
        label: 내 보증금 비율 100% 이상
        explanation: 보증금과 앞선 빚을 합친 금액이 추정 집값보다 많아요. 집이 팔려도 보증금을 다 돌려받기 어려워요.
        when: {field: deposit_ratio, op: ">=", value: 1.0}
      - id: P-3
        label: 신탁등기인데 신탁사 동의서를 받을 수 없음
        explanation: 집의 실제 소유자는 신탁회사예요. 신탁사 동의 없이 맺은 계약은 보호받기 어려워요.
        when:
          all:
            - {field: registry.trust, op: "==", value: true}
            - {field: trust_consent, op: "==", value: unavailable}
      - id: P-4
        label: 위반건축물이고 보증기관 상담에서 보증 불가 답변
        explanation: 위반건축물이라 반환보증에 가입할 수 없다는 답을 받았어요.
        when:
          all:
            - {field: building.violation, op: "==", value: true}
            - {field: guarantor_consult, op: "==", value: impossible}

  - id: check_needed
    label: 확인 필요
    next_step: 연동 규칙(linkage.yaml)에 따른 확인 항목과 특약 예시를 받고 진행
    rules:
      - id: C-1
        label: 근저당 있음
        explanation: 집이 경매로 넘어가면 근저당을 가진 은행이 내 보증금보다 먼저 받아 가요. 채권최고액을 내 보증금 비율에 넣어 계산했어요.
        when: {field: registry.mortgage, op: "==", value: true}
        linkage: L-MORTGAGE
      - id: C-2
        label: 내 보증금 비율 90% 이상 (반환보증 가입이 어려운 구간)
        explanation: 반환보증 가입이 어려운 구간이에요. 계약 전에 보증기관에 가입 가능 여부를 먼저 물어보세요.
        when: {field: deposit_ratio, op: ">=", value: 0.9}
        linkage: L-RATIO90
      - id: C-3
        label: 신탁등기 (동의서 확인 전)
        explanation: 집의 실제 소유자는 신탁회사예요. 계약 전에 신탁사 동의서를 받을 수 있는지 확인하세요.
        when:
          all:
            - {field: registry.trust, op: "==", value: true}
            - {field: trust_consent, op: "==", value: unknown}
        linkage: L-TRUST
      - id: C-4
        label: 위반건축물 (보증기관 상담 전)
        explanation: 위반건축물은 반환보증 가입이 거절될 수 있어요. 보증기관에 먼저 상담해 보세요.
        when:
          all:
            - {field: building.violation, op: "==", value: true}
            - {field: guarantor_consult, op: "==", value: not_yet}
        linkage: L-VIOLATION

  - id: no_problem
    label: 문제 항목 없음
    next_step: 기본 할 일로 진행
    default: true   # 위 단계에 하나도 해당하지 않으면 이 단계

# 판정과 별개로 결과 화면에 항상 함께 보여 주는 "확인 못 한 항목" (FR-010)
unchecked_items:
  - id: U-TAX
    label: 임대인 국세·지방세 체납
    guide: 이 서비스로는 확인할 수 없어요. 임대인에게 국세·지방세 완납증명서를 요청하고, HUG 안심전세앱에서 임대인 위험도도 함께 조회해 보세요.
    linkage: L-TAX
  - id: U-OTHER-DEPOSITS
    label: 다가구 다른 세대의 보증금
    guide: 등기부에 나오지 않아요. 임대인에게 다른 세대의 보증금과 계약 기간을 서면으로 받아 두세요.
    applies_when: {field: housing_type, op: in, value: [multi_household, detached]}
    linkage: L-MULTI

# 모든 결과 화면 공통 문구 (FR-010, NFR-014)
display:
  disclaimer: 정보 제공이며 보증하지 않습니다.
  forbidden_phrases: [안전합니다, 안전한 집, 문제없습니다]
  also_show: HUG 안심전세앱의 집·임대인 위험도 조회 안내
