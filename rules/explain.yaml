# 등기 항목 쉬운 말 설명 (FR-007, 명세서 8장 AI-REQ-01~05, UC-002 5단계)
# 처리 흐름: 사용자가 확인한 등기 항목 → LLM 설명 → 금지 표현·숫자 검사 → 화면. 판정·비율·기한은 LLM이 바꾸지 않는다 (AI-REQ-02)
# LLM이 꺼져 있거나(ANTHROPIC_API_KEY 없음, LLM_EXPLAIN=false) 실패·시간 초과·검사 탈락이면 아래 템플릿 설명을 쓴다 (AI-REQ-04)
version: "1.0"
as_of: "2026-10-28"
basis: "요구사항 명세서 v0.5 FR-007, 8장 AI 관련 요구사항, NFR-001·007"

# 종류별 템플릿 설명. {amount}는 규칙 파서가 읽은 금액을 그대로 넣는다 (예: 1억 2,000만 원). 금액을 못 읽었으면 *_no_amount
templates:
  mortgage: 집주인이 이 집을 담보로 돈을 빌렸다는 기록이에요. 채권최고액 {amount}은 집이 경매로 팔리면 내 보증금보다 먼저 갚을 수 있는 최대 금액이라 내 보증금 비율 계산에 넣었어요.
  mortgage_no_amount: 집주인이 이 집을 담보로 돈을 빌렸다는 기록이에요. 채권최고액을 읽지 못했으니 원문에서 금액을 확인해 직접 입력해 주세요.
  lease: 다른 세입자의 임차권·전세권 기록이에요. 보증금 {amount}을 아직 돌려받지 못했다면 내 보증금보다 먼저 받을 수 있어 선순위 채권에 넣었어요. 이미 돌려받았거나 내 계약이면 확인 화면에서 빼 주세요.
  lease_no_amount: 다른 세입자의 임차권·전세권 기록이에요. 보증금을 읽지 못했으니 원문에서 금액을 확인해 주세요.
  seizure: 집주인의 빚 때문에 이 집을 마음대로 팔거나 넘기지 못하게 묶어 둔 기록(압류·가압류 등)이에요. 경매로 이어질 수 있어 계약 전에 풀렸는지 확인해야 해요.
  trust: 집의 소유권이 신탁회사로 넘어가 있다는 기록이에요. 이때는 집주인 혼자 전세 계약을 할 수 없고 신탁회사의 동의가 필요해요.
  other: 등기부에 있는 그 밖의 권리 기록이에요. 내용이 낯설면 계약 전에 공인중개사나 공공 상담 창구에 물어보세요.

# LLM 설정. 모델은 환경 변수 LLM_MODEL로 바꿀 수 있다
llm:
  model: claude-opus-5-5
  effort: low              # 짧은 설명이라 낮은 노력으로 (응답 시간)
  timeout_seconds: 8       # 넘으면 템플릿 (NFR-001: 추출 결과는 먼저 보여 주고 설명은 뒤에 채움)
  max_chars: 220           # 항목 하나 설명 길이. 넘으면 템플릿
  max_items: 20            # 한 번에 설명하는 항목 수

# 화면 문구에 쓰지 않는 표현 (AI-REQ-03). verdict.yaml display.forbidden_phrases(안전 단정)와 함께 검사한다
# 개별 법률 판단·특정 대출·보증 상품 추천 표현
forbidden_phrases: [승소, 소송하세요, 고소하세요, 추천드, 추천해요, 추천합니다, 가입하세요, 대출받으세요, 걱정 없, 괜찮아요, 괜찮습니다]

# LLM 지시문. 항목마다 템플릿 설명을 사실 근거로 함께 보내고, 그 범위 안에서만 다시 쓰게 한다 (AI-REQ-01)
system_prompt: |
  당신은 처음 전세 계약을 하는 20~30대 세입자에게 등기부 항목의 뜻을 쉬운 말로 풀어 주는 역할입니다.
  각 항목마다 등기 목적, 금액, 그리고 사실 근거가 되는 기준 설명이 주어집니다.

  지킬 것:
  - 항목마다 해요체 1~2문장, 200자 이내로 씁니다.
  - 기준 설명에 있는 사실만 씁니다. 주어지지 않은 금액·날짜·권리·사람·위험 정도를 새로 만들지 않습니다.
  - 금액은 주어진 표기 그대로 옮기고, 다른 숫자는 쓰지 않습니다.
  - 이 집이 안전하다거나 문제없다고 단정하지 않습니다. 계약해도 된다/하지 말라는 판단도 하지 않습니다.
  - 소송·고소 같은 개별 법률 판단이나 특정 대출·보증 상품 추천을 하지 않습니다.
  - 어려운 법률 용어는 일상어로 바꾸되, 등기 목적 이름(예: 근저당권설정)은 그대로 한 번 써도 됩니다.
  - 각 항목의 id를 그대로 돌려줍니다.
