# 등기부 요약 추출 정답표 (검증 샘플 10건, 중간 점검 10/20 기준: 항목 95% 이상)
# - 사람이 각 샘플의 원문(backend/tests/fixtures/registry/*.txt)을 읽고 적은 값이다. 파서 결과를 옮겨 적지 않는다
# - 원문은 실제 "부동산정보요약" PDF에서 뽑은 글자를 집·사람을 찾을 수 없게 바꾼 것 (fixtures/registry/README.md)
# - 항목: 소유자 이름, 갑구 등기(순위번호·종류: seizure = 압류·가압류·가처분·경매, trust = 신탁),
#   을구 근저당(순위번호별 채권최고액·근저당권자), 을구 전세권·임차권(순위번호별 등기목적·보증금·권리자),
#   판정 입력 5칸(fields: POST /api/checks의 registry)
# - holder: null + holder_visible: false = PDF 원문에서 잘려 보이지 않는 이름. 사람도 읽을 수 없어 채점에서 뺀다
# - 채점: backend/measure_registry_accuracy.py, 결과 문서: 등기부추출_정확도.md
version: "1.0"
as_of: "2026-10-14"

samples:
  - file: iros_apartment_mortgage.txt
    note: 아파트, 단독소유, 근저당 2건
    owners: [김가상]
    gapgu: []
    mortgages:
      - {rank: "15", amount: 40200000, holder: 주식회사가상은행}
      - {rank: "16", amount: 50000000, holder: 주식회사가상은행}
    leases: []
    fields: {seizure: false, mortgage: true, mortgage_amount: 90200000, lease_amount: 0, trust: false}

  - file: iros_seizures_auction.txt
    note: 경매 진행 중 아파트, 압류 3건·가압류 4건·강제경매·임의경매, 근저당 1건
    owners: [최가상]
    gapgu:
      - {rank: "9", kind: seizure}    # 압류
      - {rank: "10", kind: seizure}   # 가압류
      - {rank: "11", kind: seizure}   # 가압류
      - {rank: "12", kind: seizure}   # 강제경매개시결정
      - {rank: "13", kind: seizure}   # 압류
      - {rank: "14", kind: seizure}   # 가압류
      - {rank: "15", kind: seizure}   # 가압류
      - {rank: "16", kind: seizure}   # 압류
      - {rank: "17", kind: seizure}   # 임의경매개시결정
    mortgages:
      - {rank: "3", amount: 220000000, holder: 주식회사가상은행}
    leases: []
    fields: {seizure: true, mortgage: true, mortgage_amount: 220000000, lease_amount: 0, trust: false}

  - file: iros_villa_coowners.txt
    note: 빌라, 공유자 2명, 갑구·을구 기록사항 없음
    owners: [이가상, 박가상]
    gapgu: []
    mortgages: []
    leases: []
    fields: {seizure: false, mortgage: false, mortgage_amount: 0, lease_amount: 0, trust: false}

  - file: iros_villa_large_mortgage.txt
    note: 구축 빌라, 근저당 3억 3,150만
    owners: [윤가상]
    gapgu: []
    mortgages:
      - {rank: "3", amount: 331500000, holder: 가상새마을금고}
    leases: []
    fields: {seizure: false, mortgage: true, mortgage_amount: 331500000, lease_amount: 0, trust: false}

  - file: demo_apartment.txt
    note: 시연 아파트, 갑구·을구 기록사항 없음
    owners: [정가상]
    gapgu: []
    mortgages: []
    leases: []
    fields: {seizure: false, mortgage: false, mortgage_amount: 0, lease_amount: 0, trust: false}

  - file: iros_trust.txt
    note: 신탁회사 공매 중 다세대, 소유자 = 수탁자, 이름이 법인번호 줄 위아래로 갈라짐
    owners: [가상자산신탁주식회사]
    gapgu:
      - {rank: "2-1", kind: trust}    # 약정/금지사항/환매특약 (신탁원부 확인 필요)
    mortgages: []
    leases: []
    fields: {seizure: false, mortgage: false, mortgage_amount: 0, lease_amount: 0, trust: true}

  - file: iros_auction_lease.txt
    note: 경매 진행 중 다세대, 을구 임차권설정
    owners: [문가상]
    gapgu:
      - {rank: "3", kind: seizure}    # 임의경매개시결정
    mortgages: []
    leases:
      - {rank: "5", purpose: 임차권설정, amount: 90000000, holder: 남가상}
    fields: {seizure: true, mortgage: false, mortgage_amount: 0, lease_amount: 90000000, trust: false}

  - file: iros_apartment_jeonse.txt
    note: 강제경매 중 구축 아파트, 가압류 2건, 을구 전세권설정
    owners: [정가상]
    gapgu:
      - {rank: "2", kind: seizure}    # 가압류
      - {rank: "3", kind: seizure}    # 가압류
      - {rank: "4", kind: seizure}    # 강제경매개시결정
    mortgages: []
    leases:
      - {rank: "15", purpose: 전세권설정, amount: 150000000, holder: 윤가상}
    fields: {seizure: true, mortgage: false, mortgage_amount: 0, lease_amount: 150000000, trust: false}

  - file: iros_apartment_six_mortgages.txt
    note: 임의경매 중 아파트, 근저당 6건
    owners: [한가상]
    gapgu:
      - {rank: "7", kind: seizure}    # 임의경매개시결정
    mortgages:
      - {rank: "6", amount: 52000000, holder: 주식회사가상은행}
      - {rank: "8", amount: 13000000, holder: 주식회사가상은행}
      - {rank: "9", amount: 156000000, holder: 주식회사가상은행}
      - {rank: "10", amount: 60500000, holder: 주식회사가상은행}
      - {rank: "11", amount: 45000000, holder: 주식회사가상은행}
      - {rank: "12", amount: 818000000, holder: 주식회사나라은행}
    leases: []
    fields: {seizure: true, mortgage: true, mortgage_amount: 1144500000, lease_amount: 0, trust: false}

  - file: iros_villa_jeonse_and_lease.txt
    note: 강제경매 중 다세대, 같은 보증금이 전세권(1.2억)과 임차권(못 돌려받은 1.1억)으로 함께 남음
    owners: [오가상]
    gapgu:
      - {rank: "5", kind: seizure}    # 가압류
      - {rank: "6", kind: seizure}    # 강제경매개시결정
      - {rank: "7", kind: seizure}    # 압류
      - {rank: "8", kind: seizure}    # 압류
      - {rank: "9", kind: seizure}    # 압류
    mortgages: []
    leases:
      - {rank: "1", purpose: 전세권설정, amount: 120000000, holder: 가상엘리베이터주식회사}
      - {rank: "2", purpose: 임차권설정, amount: 110000000, holder: null, holder_visible: false}   # 임차권자 이름이 PDF에서 잘림
    # 선순위 채권의 임차권·전세권 보증금: 같은 보증금은 한 번만, 못 돌려받은 금액(임차권 1.1억)으로 (PO 결정 2026-10-13)
    fields: {seizure: true, mortgage: false, mortgage_amount: 0, lease_amount: 110000000, trust: false}
