# 기한 계산 시나리오 정답표 (기계용). 사람이 읽는 표: 기한계산_정답표.md
version: '0.1'
status: 초안 (PO 검토 전)
doc: 기한계산_정답표.md
conventions:
- C1 N일 = 기준일 ± N일
- C2 월 이동은 말일 보정
- C3 월 먼저, 일 나중
- C4 주말·공휴일 보정 없음
- C5 HUG 마감 = 잔금일 + floor((만기일-잔금일)/2)일
- C6 대출 없으면 T5 시작 = 전입신고 완료일(잔금일 가정) + 1일
- 'C7 순서: 맨 위 규칙 → 고정(T5~T9) → 기한순'
- C8 경보 단계 정상(시나리오 9만 경고)
open_questions: 문서 마지막 절 Q1~Q8. 해당 칸은 'pending_po' 표시
