# 시연 집 2채 (5분 시연, 경보 계산 검증 NFR-004)
# - 단지·공시가격·실거래·등기부 구성은 실제 자료. 등기부 텍스트는 이름·주민번호·주소·고유번호·접수번호를 가렸고,
#   어느 세대인지는 적지 않는다 (같은 단지·면적·층대의 공시가격이 같은 세대)
# - 빌라의 근저당 1건은 시연용 가상 근저당이다 (아래 virtual). 열람한 제이제이 3개 호(201·301·401)가 모두
#   근저당이 없었고, 근저당이 있는 실제 집은 보증금 0원이어도 비율 100%를 넘어(P-2) 계약 당일 화면까지 갈 수 없었다
# - 입력은 POST /api/checks 형식, 기대값은 기준일(as_of)에 demo_trades_2026-10-13.json을 저장해 둔 상태의 결과
# - 계산 과정은 경보계산_정답표.md
version: "1.0"
as_of: "2026-10-13"
trades: demo_trades_2026-10-13.json

houses:
  - id: demo-apartment
    title: 해운대 아파트 (근저당 없음, 경보 주의)
    complex_address: 부산광역시 해운대구 세실로 7 (좌동 1331 해운대상록아파트), 59.85㎡ 2~3층 세대
    registry_fixture: backend/tests/fixtures/registry/demo_apartment.txt
    registry_owner: 정가상
    official_price_source: 부동산공시가격알리미 2026.1.1 공동주택가격 (59.85㎡ 2~3층 세대 1억 6,500만)
    input:
      housing_type: apartment
      deposit: 200000000
      official_price: 165000000
      exclusive_area: 59.85
      complex: {lawd_cd: "26350", umd_name: 좌동, complex_name: 상록}
      registry: {seizure: false, mortgage: false, mortgage_amount: 0, trust: false}
    expected:
      estimated_price: 231000000          # 공시가격 × 140%. 매매 3억(2026-10-03)이 더 높아 쓰지 않음
      trade_basis: {price: 300000000, deal_date: "2026-10-03", exclusive_area: 59.85, sample_count: 48, used: false}
      nearby_jeonse: {median: 190000000, sample_count: 39, low_sample: false, below_deposit: true}
      deposit_ratio: 0.8658               # 2억 ÷ 2.31억
      verdict: no_problem
      matched: []
      linkages: []
      alert_level: caution                # 비율 80% 이상, 주변 전세 1.9억 < 보증금 2억 (두 조건 모두)

  - id: demo-villa
    title: 수영구 빌라 (근저당·비율 90% 이상, 특약 분기 2개)
    complex_address: 부산광역시 수영구 무학로52번길 36-11 (광안동 129-46 제이제이), 30.03㎡ 세대
    registry_fixture: backend/tests/fixtures/registry/demo_villa.txt
    registry_owner: 한가상
    official_price_source: 부동산공시가격알리미 2026.1.1 공동주택가격 (30.03㎡ 2~4층 세대 1억 1,600만)
    virtual:
      - 을구 5번 근저당권설정 채권최고액 1,440만 원 (대출 1,200만 × 120%), 근저당권자 주식회사가상은행. 실제 세대의 을구는 기록사항 없음
    input:
      housing_type: row_house
      deposit: 140000000
      official_price: 116000000
      exclusive_area: 30.03
      complex: {lawd_cd: "26500", umd_name: 광안동, complex_name: 제이제이, jibun: 129-46}
      registry: {seizure: false, mortgage: true, mortgage_amount: 14400000, trust: false}
    expected:
      estimated_price: 162400000          # 공시가격 × 140%. 매매 2.5억(2026-09-30)이 더 높아 쓰지 않음
      trade_basis: {price: 250000000, deal_date: "2026-09-30", exclusive_area: 30.09, sample_count: 14, used: false}
      nearby_jeonse: {median: 145000000, sample_count: 17, low_sample: false, below_deposit: false}
      deposit_ratio: 0.9507               # (1.4억 + 0.144억) ÷ 1.624억. 근저당이 없으면 86.2%
      verdict: check_needed
      matched: [C-1, C-2]
      linkages: [L-MORTGAGE, L-RATIO90]
      alert_level: warning                # 비율 90% 이상
    contract_day:                         # 시연 장면 (S7 날짜). 할 일 순서는 deadline_scenarios.yaml 기준과 같은 엔진
      dates: {contract_date: "2026-10-14", balance_date: "2026-11-25", end_date: "2028-11-24"}
      special_term_result: {S-NO-MORTGAGE: rejected, S-GUARANTEE-CANCEL: inserted}
      expected:
        top: T4                           # 담보 설정 금지 거절 → 4번 전입신고 맨 위
        T2_due: "2026-10-14"              # L-RATIO90: 보증기관 상담을 계약일까지
        T3_required_check: 근저당 금액 변동 비교 (필수)
