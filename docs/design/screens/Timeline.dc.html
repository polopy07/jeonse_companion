<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>계약 타임라인</title>
<script src="../preview.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1D3B5C}a:hover{color:#0F2338}
</style>
</helmet>
<div style="width: 390px; height: 1000px; box-sizing: border-box; background: #F4F2EC; font-family: 'IBM Plex Sans KR', sans-serif; color: #17202A; display: flex; flex-direction: column">
  <div style="padding: 12px 8px 0; display: flex; align-items: center; gap: 4px">
    <a href="Main.dc.html" aria-label="뒤로" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #17202A">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"></path></svg>
    </a>
    <div style="font-size: 16px; font-weight: 600">계약 타임라인</div>
  </div>
  <div style="padding: 4px 20px 0; font-size: 13px; color: #55606B">수영구 ○○동 빌라 201호 · 2026.10.20 ~ 2028.11.19</div>

  <div style="margin: 14px 20px 0; display: flex; gap: 6px; flex-wrap: wrap">
    <div style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: #55606B; padding: 4px 10px; border-radius: 999px; background: #FFFFFF; border: 1px solid #E3DFD6"><div style="width: 8px; height: 8px; border-radius: 4px; background: #1D3B5C"></div>계약·점검</div>
    <div style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: #55606B; padding: 4px 10px; border-radius: 999px; background: #FFFFFF; border: 1px solid #E3DFD6"><div style="width: 8px; height: 8px; border-radius: 4px; background: #2B5C8A"></div>할 일 완료</div>
    <div style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: #55606B; padding: 4px 10px; border-radius: 999px; background: #FFFFFF; border: 1px solid #E3DFD6"><div style="width: 8px; height: 8px; border-radius: 4px; background: #B85A0B"></div>경보·특약</div>
  </div>

  <div style="margin: 16px 20px 0; position: relative; display: flex; flex-direction: column; gap: 4px">
    <div style="position: absolute; left: 56px; top: 8px; bottom: 8px; width: 2px; background: #DAD5CA"></div>
    <sc-for list="{{ events }}" as="e" hint-placeholder-count="9">
      <div style="display: flex; gap: 12px; align-items: flex-start; position: relative">
        <div style="width: 40px; flex-shrink: 0; text-align: right; padding-top: 12px">
          <div style="font-size: 10px; color: #6B7580">{{ e.year }}</div>
          <div style="font-size: 12px; font-weight: 600">{{ e.md }}</div>
        </div>
        <div style="{{ e.dot }}"></div>
        <div style="flex: 1; min-width: 0; padding: 10px 12px; background: #FFFFFF; border-radius: 12px; border: 1px solid #E3DFD6; display: flex; justify-content: space-between; align-items: center; gap: 8px">
          <div style="min-width: 0">
            <div style="font-size: 14px; font-weight: 600">{{ e.title }}</div>
            <div style="font-size: 12px; color: #55606B; margin-top: 2px">{{ e.sub }}</div>
          </div>
          <sc-if value="{{ e.photo }}" hint-placeholder-val="{{ false }}">
            <div style="width: 36px; height: 36px; border-radius: 6px; background: #E8E4DA; flex-shrink: 0; display: flex; align-items: center; justify-content: center">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6B7580" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path><path d="M14 3v6h6"></path></svg>
            </div>
          </sc-if>
        </div>
      </div>
    </sc-for>
  </div>

  <div style="flex: 1"></div>
  <div style="font-size: 11px; color: #6B7580; padding: 16px 20px 20px; line-height: 1.5">이 기록은 반환 확인 후 3개월 동안 보관돼요.</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1000}}'>
class Component extends DCLogic {
renderVals() {
var colors = { c: '#1D3B5C', t: '#2B5C8A', a: '#B85A0B' };
var raw = [
['2026', '10.09', 'c', '계약 전 확인', '확인 필요 · 근저당 있음', false],
['2026', '10.20', 'c', '계약 당일 현장 확인', '소유자·대리인·계좌 명의 확인', true],
['2026', '10.20', 'a', '특약 거절당함', '잔금일 다음 날까지 담보 설정 금지', false],
['2026', '10.21', 't', '임대차 신고', '확정일자 함께 받음', true],
['2026', '10.28', 't', '보증 가입 여부 확정', 'HUG 반환보증 가입 예정', false],
['2026', '11.20', 't', '잔금일 등기부 재비교', '새 담보 없음', true],
['2026', '11.20', 't', '전입신고', '잔금 당일 완료', true],
['2027', '04.30', 'a', '경보 단계 변화', '84% → 88% · 공시가격 하락', false],
['2028', '09.10', 't', '이사 의사 통보', '내용증명 사본 저장', true]
];
var events = raw.map(function (r) {
return {
year: r[0], md: r[1], title: r[3], sub: r[4], photo: r[5],
dot: 'width: 12px; height: 12px; border-radius: 6px; flex-shrink: 0; margin-top: 18px; position: relative; left: -1px; border: 2px solid #F4F2EC; background: ' + colors[r[2]]
};
});
return { events: events };
}
}
</script>
</body>
</html>
