# PR과 main 푸시마다 백엔드 테스트와 규칙 파일 검사를 돌린다.
# DB는 SQLite(테스트 기본값). PostgreSQL로도 돌리는 것은 나중에 정한다.
name: test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: 의존성 설치
        run: pip install -r backend/requirements.txt

      - name: 규칙 파일 검사
        run: python rules/check_rules.py

      - name: 백엔드 테스트
        working-directory: backend
        run: pytest -q
